<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoloHQ — Revenue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0c10;--surface:#12151c;--border:#1e232e;--text:#d1d5e0;--text-dim:#545d6e;
  --green:#39d353;--green-2:#26a641;--green-3:#006d32;--green-4:#0e4429;
  --yellow:#d4a017;--red:#e55b5b;--accent:#58a6ff;
  --font:'Noto Sans TC',-apple-system,sans-serif;--font-mono:'JetBrains Mono','SF Mono',monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
a{color:var(--accent);text-decoration:none}

.nav{display:flex;align-items:center;gap:4px;padding:12px 32px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.nav__brand{font-family:var(--font-mono);font-weight:700;font-size:16px;color:var(--green);margin-right:24px;letter-spacing:-0.5px}
.nav a{color:var(--text-dim);padding:6px 14px;border-radius:6px;font-size:14px;font-weight:600;transition:all 0.15s}
.nav a:hover{color:var(--text);background:rgba(255,255,255,0.04)}
.nav a.active{color:var(--text);background:rgba(255,255,255,0.08)}

.container{max-width:960px;margin:0 auto;padding:28px 32px}

h1{font-size:28px;font-weight:900;color:#fff;margin-bottom:24px}

.total{font-size:48px;font-weight:900;color:var(--green);text-align:center;margin-bottom:8px;font-family:var(--font-mono);letter-spacing:-2px}

.revenue-bar{margin-bottom:28px}
.revenue-bar__labels{display:flex;justify-content:space-between;font-size:13px;color:var(--text-dim);font-family:var(--font-mono);margin-bottom:8px}
.revenue-bar__labels strong{color:var(--green)}
.revenue-bar__track{height:14px;background:var(--border);border-radius:7px;overflow:hidden;position:relative}
.revenue-bar__fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--green-4),var(--green-3),var(--green-2),var(--green));transition:width 0.6s ease;box-shadow:0 0 12px var(--green-4)}
.revenue-bar__pct{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;font-family:var(--font-mono);color:#fff;font-weight:700}

.form{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px;
  padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;
}
.form label{font-size:12px;color:var(--text-dim);display:block;margin-bottom:4px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.5px}
.form input,.form select{
  width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);
  padding:10px 12px;border-radius:8px;font-size:15px;font-family:var(--font);
}
.form input:focus,.form select:focus{border-color:var(--accent);outline:none}
.form .full{grid-column:1/-1}
.form button{
  grid-column:1/-1;background:var(--green-2);color:#fff;border:none;
  padding:12px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:700;
  font-family:var(--font);margin-top:4px;transition:background 0.15s;
}
.form button:hover{background:var(--green)}

.entry{
  display:flex;align-items:center;gap:12px;padding:12px 16px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  margin-bottom:5px;font-size:15px;transition:border-color 0.15s;
}
.entry:hover{border-color:#2a3040}
.entry-amount{color:var(--green);font-weight:700;min-width:100px;font-family:var(--font-mono)}
.entry-brand{color:var(--text-dim);min-width:90px;font-weight:600}
.entry-source{flex:1;color:var(--text)}
.entry-date{color:var(--text-dim);font-size:13px;min-width:90px;text-align:right;font-family:var(--font-mono)}
.entry-del{border:none;background:none;color:var(--text-dim);cursor:pointer;font-size:18px;padding:4px 8px;opacity:0;transition:all 0.15s}
.entry:hover .entry-del{opacity:1}
.entry-del:hover{color:var(--red)}

@media(max-width:700px){.container{padding:20px 16px}.nav{padding:10px 16px}.total{font-size:36px}}
</style>
</head>
<body>
<nav class="nav">
  <span class="nav__brand">SoloHQ</span>
  <a href="/">Dashboard</a>
  <a href="/do">Tasks</a>
  <a href="/matrix">Matrix</a>
  <a href="/revenue" class="active">Revenue</a>
  <a href="/brands">Brands</a>
</nav>

<div class="container">
  <h1>Revenue</h1>

  <div id="total" class="total"></div>
  <div id="revenue-bar"></div>

  <div class="form">
    <div>
      <label>品牌</label>
      <select id="f-brand"></select>
    </div>
    <div>
      <label>金額 (NTD)</label>
      <input id="f-amount" type="number" min="0" placeholder="2500" />
    </div>
    <div>
      <label>來源</label>
      <input id="f-source" placeholder="課程購買" />
    </div>
    <div>
      <label>日期</label>
      <input id="f-date" type="date" />
    </div>
    <div class="full">
      <label>備註</label>
      <input id="f-note" placeholder="可選" />
    </div>
    <button id="add-btn">記錄收入</button>
  </div>

  <div id="entries"></div>
</div>

<script src="/app.js"></script>
<script>
const { api, formatNTD, el, $, setupAuth, renderRevenueBar } = SoloHQ
setupAuth()
$('#f-date').value = new Date().toISOString().slice(0, 10)

async function loadBrands() {
  const { brands } = await api('GET', '/api/brands')
  const select = $('#f-brand')
  for (const b of brands) select.appendChild(el('option', { value: b.id, textContent: b.name }))
}

$('#add-btn').addEventListener('click', async () => {
  const amount = parseInt($('#f-amount').value, 10)
  if (!amount || amount <= 0) return alert('請輸入金額')
  const brand_id = $('#f-brand').value
  if (!brand_id) return alert('請選擇品牌')
  await api('POST', '/api/revenue', {
    brand_id, amount,
    source: $('#f-source').value,
    note: $('#f-note').value,
    date: $('#f-date').value,
  })
  $('#f-amount').value = ''
  $('#f-source').value = ''
  $('#f-note').value = ''
  loadEntries()
})

async function loadEntries() {
  const { entries } = await api('GET', '/api/revenue')
  const container = $('#entries')
  container.innerHTML = ''

  let total = 0
  for (const e of entries) total += (e.amount || 0)
  $('#total').textContent = formatNTD(total)

  try {
    const data = await api('GET', '/api/stats')
    renderRevenueBar($('#revenue-bar'), data.total_revenue, data.revenue_goal)
  } catch {}

  for (const entry of entries) {
    container.appendChild(el('div', { className: 'entry' }, [
      el('span', { className: 'entry-amount', textContent: formatNTD(entry.amount) }),
      el('span', { className: 'entry-brand', textContent: entry.brand_id }),
      el('span', { className: 'entry-source', textContent: entry.source || entry.note || '' }),
      el('span', { className: 'entry-date', textContent: entry.date || '' }),
      el('button', {
        className: 'entry-del', textContent: '×',
        onClick: async () => {
          if (!confirm('刪除此筆收入？')) return
          await api('DELETE', `/api/revenue/${entry.id}`)
          loadEntries()
        },
      }),
    ]))
  }
}
loadBrands().then(loadEntries)
</script>
<script src="/theme.js"></script>
</body>
</html>
